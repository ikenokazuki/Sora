description = "Verify a candidate HTS/HS code against official USITC data using Sora engine"
prompt = "Use the verify_hts_code MCP tool (or sora CLI: /home/ikeno/app/web-fetcher/bin/sora hts-verify <htsCode> <productDescription>) to verify a candidate HTS code for the product described as: '{{args}}'. Keyword search cannot uniquely identify an HTS code, so first infer a candidate code yourself based on the product's material, use, function, and processing level, then call the tool with that code and the product description to confirm it exists in official USITC data and get the tariff rate. If it is not an exact match, review the nearby candidates the tool returns instead of guessing further."
