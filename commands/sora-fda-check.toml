description = "Check US FDA regulation likelihood for a product HTS code using Sora engine"
prompt = "Use the check_fda_regulated MCP tool (or sora CLI: /home/ikeno/app/web-fetcher/bin/sora fda-check <htsCode>) to estimate whether the product described as '{{args}}' is likely regulated by the US FDA, based on its HTS chapter. Infer the HTS code from the description if not explicitly given, then present the possible FDA programs and whether Prior Notice may apply. This is a chapter-level estimate, not a precise official mapping, and not legal advice."
