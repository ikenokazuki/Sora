name: Test
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:
jobs:
  bun-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - id: chrome
        uses: browser-actions/setup-chrome@latest
      - run: bun install --frozen-lockfile
      - name: Typecheck (strict, src + tool-health scripts)
        run: bun run typecheck
      # 実ブラウザテストは共有ランナーで低速なため上限を60秒に緩和する
      - name: Run tests with failure summary
        run: |
          set +e
          bun test --timeout 60000 --reporter=junit --reporter-outfile=junit.xml > test-console.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            tail -n 8 test-console.log
          else
            cat test-console.log
          fi
          python3 scripts/junit_parse.py junit.xml | tee -a "$GITHUB_STEP_SUMMARY"
          exit $code
        env:
          NODE_ENV: test
          SORA_DB_PATH: ":memory:"
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            junit.xml
            test-console.log
          retention-days: 7
