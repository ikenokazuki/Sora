name: Build and Publish Container Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ikenokazuki/sora
  CANDIDATE_TAG: sora-tool-health:candidate

jobs:
  test:
    name: Full body checks (publish gate)
    uses: ./.github/workflows/test.yml

  build-candidate:
    name: Build candidate image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build candidate image (no push yet)
        run: docker build -f Containerfile -t "$CANDIDATE_TAG" .
      - name: Record candidate image id
        run: |
          docker inspect --format '{{.Id}}' "$CANDIDATE_TAG" | tee candidate-image-id.txt
          docker save "$CANDIDATE_TAG" -o candidate.tar
      - name: Upload candidate image archive
        uses: actions/upload-artifact@v4
        with:
          name: tool-health-candidate
          path: |
            candidate.tar
            candidate-image-id.txt
          retention-days: 7

  live:
    name: Live tool health on candidate
    needs: [build-candidate]
    uses: ./.github/workflows/live-tools.yml
    secrets: inherit
    with:
      image-artifact: tool-health-candidate
      image-tag: sora-tool-health:candidate

  build-and-push:
    name: Push the tested candidate image
    needs: [live]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download candidate image archive
        uses: actions/download-artifact@v4
        with:
          name: tool-health-candidate
          path: /tmp/tool-health-image
      - name: Load the exact tested image
        run: |
          docker load -i /tmp/tool-health-image/candidate.tar
          LOADED="$(docker inspect --format '{{.Id}}' "$CANDIDATE_TAG")"
          EXPECTED="$(cat /tmp/tool-health-image/candidate-image-id.txt)"
          if [ "$LOADED" != "$EXPECTED" ]; then
            echo "candidate image id mismatch: $LOADED != $EXPECTED"
            exit 1
          fi
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Retag tested candidate and push
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker tag "$CANDIDATE_TAG" "$tag"
            docker push "$tag"
          done
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Sora Release ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md
