name: Build and Publish Container Image

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ikenokazuki/sora

jobs:
  test:
    name: Hermetic tests (publish gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (frozen lockfile required)
        run: bun install --frozen-lockfile
      - name: Typecheck (strict)
        run: bun run typecheck
      - name: Run hermetic test subset
        run: >
          bun test src/services/yahoo_query_union.test.ts
          src/scraper_selector.test.ts src/search_diagnostics.test.ts
          src/extractor/information_retrieval.test.ts src/security/credential_scope.test.ts
          src/security/scrape_cache_isolation.test.ts src/net/safe_transport.test.ts
          src/http_fetcher_redirect.test.ts src/auth.test.ts
          src/security/tenant_context.test.ts src/security/tenant_isolation.test.ts
          src/browser_session_access.test.ts src/retrieval/rrf.test.ts
          src/retrieval/requirements.test.ts --timeout 60000
  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Containerfile
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: "Sora Release ${{ github.ref_name }}"
          body_path: RELEASE_NOTES.md

