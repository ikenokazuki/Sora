name: Chromium update check

# 週に 1 回、最新のリリースのイメージの Chromium と、Debian（bookworm）が出している chromium を比べる。
# Debian のほうが新しければ issue で知らせ、同じ版になれば閉じる。イメージの作成・配布はしない（リリースは人が決める）。
# 読むのは、公開イメージ・Debian・Google の公開の情報だけ。

on:
  schedule:
    - cron: '17 21 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compare Chromium versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/chromium-update-check.sh
