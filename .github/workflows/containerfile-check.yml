name: Containerfile
# Containerfile や依存の固定を変える PR だけ、イメージを実際にビルドして、wreq-js の native などが入っていることを確かめる。
# 公開のワークフロー（docker-publish.yml）は main への push でしかイメージをビルドしないので、これが無いと、ビルドの失敗はマージの後に分かる。
on:
  pull_request:
    paths:
      - Containerfile
      - package.json
      - bun.lock
      - vendor/**
      - scripts/image-smoke.ts
      - scripts/verify-image.sh
      - scripts/tls-fingerprint/**
      - scripts/wreq-native/**
      - scripts/browser-isolation-check.ts
      - scripts/browser-capdrop-check.ts
      - scripts/browser-egress-check.ts
      - scripts/static-egress-check.ts
      - scripts/fetch-egress-check.ts
      - scripts/auth-check.ts
      - deploy/seccomp-sora.json
      - native/chromium-launcher/**
      - src/browser_engine.ts
      - src/browser_launch_plan.ts
      - src/browser_stealth.ts
      - src/http_fetcher.ts
      - src/services/address_builder.ts
      - src/net/egress.ts
      - src/net/egress_fetch.ts
      - src/net/egress_gateway.ts
      - src/net/ip_policy.ts
      - src/net/proxy_config.ts
      - src/auth.ts
      - src/mcp.ts
      - src/routes/mcp_route.ts
      - .github/workflows/containerfile-check.yml
concurrency:
  group: containerfile-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f Containerfile -t sora-containerfile-check .
      # イメージの中で、(1) 置き換えた native を読めていること、(2) イメージの Chromium と自前の native が、同じ Chrome の姿（ClientHello）を送ること
      # （docs/browser-alignment.md）、(3) Chromium が root でなく別 uid で動き、運用者の秘密を読めないこと（サンドボックスは使えなければ off でよい）、
      # (4)(5) --cap-drop=ALL の運用を壊さないこと（落とせなければ警告して従来どおり。5 つの capability を足せば別 uid）を確かめる。
      # (6)(7) Docker の既定の seccomp を、deploy/seccomp-sora.json に替えると、Chromium のサンドボックスが有効になること（ランナーの Docker で）を確かめる。
      # (8)(9) ブラウザの通信を出口のゲートウェイに通すと（SORA_EGRESS_GATEWAY=on）、内部の宛先は断られ、名前はゲートウェイが解決し、ClientHello は変わらないこと
      # （既定の運用と、サンドボックス有効の硬化した運用の両方で）を確かめる。
      # (10) 静的取得（イメージの wreq-js の native）を出口のゲートウェイに通すと、DNS rebinding は断られ、名前はゲートウェイが解決し、ClientHello は変わらないことを確かめる。
      # wreq-native-update.yml（上流の新しい rev の試しビルド）も、同じスクリプトで確かめる
      - name: Verify inside the image
        run: bash scripts/verify-image.sh sora-containerfile-check
